services:
  # ==========================================================================
  # INFRA — databases & cache
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ==========================================================================
  # APPLICATION SERVICES
  # ==========================================================================
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./services/api-gateway/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: api-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - redis
      - auth-service
      - user-service
      - room-service
      - chat-service
      - recording-service
      - notification-service
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ./services/auth-service/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: auth-service
    depends_on:
      - postgres
      - redis

  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    env_file:
      - ./services/user-service/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: user-service
    depends_on:
      - postgres
      - redis

  room-service:
    build: ./services/room-service
    container_name: room-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    env_file:
      - ./services/room-service/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: room-service
    depends_on:
      - postgres
      - redis
      - auth-service

  signaling-service:
    build: ./services/signaling-service
    container_name: signaling-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    env_file:
      - ./services/signaling-service/.env.docker
      - ./infra/observability.env
    environment:
      - SFU_SERVICE_URL=http://sfu-service:4006
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEFAULT_ROOM_MODE=sfu          # "sfu" (default) or "mesh" (fallback)
      - OTEL_SERVICE_NAME=signaling-service
    depends_on:
      - redis
      - room-service
      - sfu-service
  chat-service:
    build: ./services/chat-service
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    env_file:
      - ./services/chat-service/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: chat-service
    depends_on:
      - mongo
      - redis

  sfu-service:
    build:
      context: ./services/sfu-service
    container_name: sfu-service
    restart: unless-stopped
    ports:
      - "4006:4006"                        # dev only — remove in production
      - "40000-40100:40000-40100/udp"      # media (must match RTC_MIN_PORT/RTC_MAX_PORT below)
      - "40000-40100:40000-40100/tcp"
    env_file:
      - ./infra/observability.env
    environment:
      - PORT=4006
      - NODE_ENV=development
      - LOG_LEVEL=info
      - NUM_WORKERS=2
      - RTC_MIN_PORT=40000
      - RTC_MAX_PORT=40100
      - ANNOUNCED_IP=127.0.0.1              # same machine = 127.0.0.1; LAN test = laptop's LAN IP; prod = public IP
      # - INTERNAL_SECRET=${INTERNAL_SECRET} # uncomment once Step 10 (authGuard) is implemented; set INTERNAL_SECRET in a root .env (gitignored)
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - DEV_CORS_ORIGIN=http://localhost:3000
      - RECORDING_DIR=/recordings
      - RECORDING_SERVICE_URL=http://recording-service:4007
      - RECORDING_RTP_MIN_PORT=50000
      - RECORDING_RTP_MAX_PORT=50200
      - OTEL_SERVICE_NAME=sfu-service
    volumes:
      - recordings_data:/recordings

  recording-service:
    build: ./services/recording-service
    container_name: recording-service
    restart: unless-stopped
    stop_grace_period: 90s
    ports:
      - "4007:4007"          # dev only
    env_file:
      - ./services/recording-service/.env.docker
      - ./infra/observability.env
    environment:
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SFU_SERVICE_URL=http://sfu-service:4006
      - FFMPEG_PATH=${FFMPEG_PATH:-ffmpeg}
      - OTEL_SERVICE_NAME=recording-service
    volumes:
      - recordings_data:/recordings
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres
      - redis
      - room-service
      - sfu-service

  # ==========================================================================
  # EMAIL & NOTIFICATIONS (Phase 11)
  # ==========================================================================
  # ---------------------------------------------------------------
  # Mailpit: fake SMTP server for development.
  #   SMTP  -> mailpit:1025  (the service sends here)
  #   Web UI -> http://localhost:8025 (you read emails here)
  # ---------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------
  # Notification service (Phase 11)
  #   Port 4008 (sfu is 4006, recording is 4007)
  # ---------------------------------------------------------------
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "4008:4008"
    env_file:
      - ./services/notification-service/.env.docker
      - ./infra/observability.env
    environment:
      OTEL_SERVICE_NAME: notification-service
    depends_on:
      - postgres
      - redis
      - mailpit

  # ==========================================================================
  # NAT TRAVERSAL — STUN/TURN (Phase 7)
  # ==========================================================================
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    restart: unless-stopped
    # network_mode: host is Linux-only and will not work correctly on Docker
    # Desktop for Windows/Mac. Use explicit port mappings instead. Adjust the
    # relay range below to match whatever is set in turnserver.conf.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49152-49200:49152-49200/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf

  # ==========================================================================
  # OBSERVABILITY — Prometheus, Grafana, Jaeger (Phase 13)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d   # keep 15 days, then delete old data
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infra/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # localhost only: Prometheus has no login
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # 3000 is used by test-client
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"   # UI. OTLP port 4318 stays inside the Docker network.

volumes:
  postgres_data:
  mongo_data:
  recordings_data:
  prometheus_data:
  grafana_data: