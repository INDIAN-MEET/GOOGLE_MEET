<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFU one-click check</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper:#E8ECEE; --ink:#13202B; --muted:#5B6B78; --line:#C5CED4;
    --ok:#0E7C6B; --bad:#C0184F; --wait:#B7791F; --panel:#F6F8F9;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { background:var(--paper); color:var(--ink); font-family:'Bricolage Grotesque',system-ui,sans-serif; }
  body { padding:clamp(16px,4vw,48px); }
  main { max-width:1040px; margin:0 auto; display:grid; gap:28px; }
  h1 { font-size:clamp(30px,5vw,52px); font-weight:800; letter-spacing:-.02em; line-height:1.05; }
  .sub { color:var(--muted); margin-top:8px; max-width:60ch; line-height:1.5; }
  .bar { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  input { font:500 14px 'IBM Plex Mono',monospace; padding:10px 12px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); border-radius:6px; width:min(420px,100%); }
  button { font:700 17px 'Bricolage Grotesque',sans-serif; background:var(--ink); color:#fff; border:0; padding:14px 28px; border-radius:6px; cursor:pointer; }
  button:hover:not(:disabled) { background:#22384a; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--ink); border:1.5px solid var(--ink); font-size:15px; padding:12px 20px; }
  button.ghost:hover:not(:disabled) { background:rgba(19,32,43,.08); }
  :focus-visible { outline:3px solid var(--wait); outline-offset:2px; }
  .verdict { font-weight:800; font-size:20px; min-height:28px; }
  .verdict.ok { color:var(--ok); } .verdict.bad { color:var(--bad); }

  .grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px; align-items:start; }
  @media (max-width:820px){ .grid { grid-template-columns:1fr; } }

  h2 { font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:14px 0 4px 42px; }
  h2:first-child { padding-top:0; }

  /* the signal path: a rail that fills as steps pass */
  ol.path { list-style:none; padding:0; position:relative; display:grid; gap:0; }
  ol.path::before { content:''; position:absolute; left:11px; top:12px; bottom:12px; width:2px; background:var(--line); }
  ol.path li { position:relative; padding:9px 0 9px 42px; display:flex; justify-content:space-between; gap:12px; font-size:15.5px; }
  ol.path li::before { content:''; position:absolute; left:4px; top:13px; width:16px; height:16px; border-radius:50%; background:var(--paper); border:2px solid var(--line); }
  ol.path li.run::before { border-color:var(--wait); background:var(--wait); }
  ol.path li.ok::before { border-color:var(--ok); background:var(--ok); }
  ol.path li.bad::before { border-color:var(--bad); background:var(--bad); }
  ol.path li .t { font:400 12px 'IBM Plex Mono',monospace; color:var(--muted); white-space:nowrap; padding-top:3px; }
  ol.path li.bad .t { color:var(--bad); white-space:normal; text-align:right; }
  ol.path li.sep { padding:14px 0 4px 42px; font:700 13px 'Bricolage Grotesque',sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  ol.path li.sep::before { display:none; }

  .views { display:grid; gap:14px; }
  figure { background:#0b141b; border-radius:8px; overflow:hidden; position:relative; aspect-ratio:16/9; }
  figure video { width:100%; height:100%; object-fit:cover; display:block; }
  figcaption { position:absolute; left:10px; bottom:10px; background:rgba(255,255,255,.92); padding:3px 10px; border-radius:4px; font-size:13px; font-weight:700; }
  #log { font:400 12px/1.6 'IBM Plex Mono',monospace; background:var(--panel); border:1.5px solid var(--line); border-radius:8px; padding:12px 14px; max-height:240px; overflow:auto; white-space:pre-wrap; color:var(--muted); }
  @media (prefers-reduced-motion:no-preference){ ol.path li.run::before { animation:p 1s infinite; } @keyframes p{50%{opacity:.35}} }
</style>
</head>
<body>
<main>
  <header>
    <h1>Does the SFU carry a call?</h1>
    <p class="sub">Part 1 starts two peers in this tab: Peer A sends your camera and mic, Peer B receives them through the SFU. Part 2 tests Step 9: peer leave and cleanup.</p>
  </header>

  <div class="bar">
    <input id="base" value="http://localhost:4006/api/v1/sfu" aria-label="SFU base URL" />
    <input id="secret" type="password" placeholder="x-internal-secret (same as INTERNAL_SECRET)" aria-label="Internal secret" />
    <button id="go">1. Run full test</button>
    <button id="stop" class="ghost" disabled>2. Test leave + cleanup</button>
    <button id="auth" class="ghost">3. Test auth (Step 10)</button>
  </div>
  <div id="verdict" class="verdict" role="status"></div>

  <div class="grid">
    <ol class="path" id="path"></ol>
    <div class="views">
      <figure><video id="va" autoplay playsinline muted></video><figcaption>Peer A sends</figcaption></figure>
      <figure><video id="vb" autoplay playsinline></video><figcaption>Peer B receives</figcaption></figure>
    </div>
  </div>

  <div id="log" aria-label="Log"></div>
</main>

<script type="module">
import * as mc from 'https://esm.sh/mediasoup-client@3';

const $ = (id) => document.getElementById(id);
const base = () => $('base').value.replace(/\/$/, '');
const logEl = $('log');
const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; };

/**
 * api(method, path, body)
 *
 * STEP 1: Call the SFU with JSON headers.
 * STEP 2: Try to parse the JSON body (it may be empty on errors).
 * STEP 3: Return { status, json } so callers can check the status code.
 */
function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  const sec = $('secret').value.trim();
  if (sec) h['x-internal-secret'] = sec;
  return h;
}
async function api(method, path, body) {
  const res = await fetch(base() + path, {
    method, headers: authHeaders(),
    body: body ? JSON.stringify(body) : undefined,
  });
  let json = null; try { json = await res.json(); } catch {}
  return { status: res.status, json };
}
const post = (path, body) => api('POST', path, body);
const get = (path) => api('GET', path);

const must = (r, want, what) => {
  if (r.status !== want) throw new Error(`${what}: got ${r.status}${r.json?.message ? ' \u2013 ' + r.json.message : ''}`);
  return r.json?.data;
};
// throw if the condition is false (used inside steps)
const check = (cond, msg) => { if (!cond) throw new Error(msg); };

// ---- step list ----
// Part 1 = indexes 0-9, Part 2 (Step 9 leave tests) = indexes 10-15
const STEPS = [
  'Get router capabilities', 'Load devices for both peers', 'Peer A: send transport',
  'Peer A: send camera and mic', 'Peer B: receive transport', 'Peer B: sees A\u2019s producers',
  'Peer B: consume video and audio', 'Video frames arrive at Peer B',
  'Rejects consuming your own stream', 'Rejects duplicate consume',
  // Part 2
  'Leave rejects missing fields (400)',
  'Peer A leaves: 2 producers closed',
  'Peer A leaves again (idempotent)',
  'Producer list is empty',
  'Peer B leaves: room closes',
  'Room can be created again',
  // Part 3 (Step 10 auth)
  'Health is open without a secret (200)',
  'API without secret is rejected (401)',
  'API with wrong secret is rejected (401)',
  'API with correct secret works (200)',
  'Bad input gets a clean 400',
];
const PART2_START = 10;
const PART3_START = 16;

const pathEl = $('path');
pathEl.innerHTML = STEPS.map((s, i) => {
  const sep = i === 0 ? '<li class="sep">Part 1 \u2013 media flow</li>'
            : i === PART2_START ? '<li class="sep">Part 2 \u2013 leave and cleanup (Step 9)</li>'
            : i === PART3_START ? '<li class="sep">Part 3 \u2013 internal auth (Step 10)</li>' : '';
  return `${sep}<li id="s${i}"><span>${s}</span><span class="t"></span></li>`;
}).join('');
const mark = (i, cls, txt = '') => { const li = $('s' + i); li.className = cls; li.querySelector('.t').textContent = txt; };

const S = {}; // shared state across run and cleanup

async function step(i, fn) {
  mark(i, 'run', '');
  const t0 = performance.now();
  try {
    const out = await fn();
    mark(i, 'ok', Math.round(performance.now() - t0) + ' ms');
    return out;
  } catch (e) {
    mark(i, 'bad', e.message);
    log('FAIL: ' + STEPS[i] + ' \u2192 ' + e.message);
    throw e;
  }
}

function wireTransport(t, roomId, peerId) {
  t.on('connect', async ({ dtlsParameters }, ok, fail) => {
    const r = await api('POST', '/transports/connect', { roomId, peerId, transportId: t.id, dtlsParameters });
    r.status === 200 ? ok() : fail(new Error('connect ' + r.status));
  });
  t.on('connectionstatechange', (s) => log(`  ${peerId} ${t.direction} transport: ${s}`));
}

/* =========================================================
 * PART 1 \u2013 media flow (unchanged logic)
 * ========================================================= */
$('go').onclick = async () => {
  $('go').disabled = true; $('stop').disabled = true;
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  logEl.textContent = '';
  STEPS.forEach((_, i) => mark(i, '', ''));

  const roomId = 'oneclick-' + Math.random().toString(36).slice(2, 8);
  const A = 'peer-a', B = 'peer-b';
  Object.keys(S).forEach((k) => delete S[k]);
  Object.assign(S, { roomId, A, B });
  log('Room: ' + roomId);

  try {
    const caps = await step(0, async () =>
      must(await get(`/router-capabilities/${roomId}`), 200, 'capabilities').routerRtpCapabilities);

    const [devA, devB] = await step(1, async () => {
      const a = new mc.Device(), b = new mc.Device();
      await a.load({ routerRtpCapabilities: caps });
      await b.load({ routerRtpCapabilities: caps });
      if (!a.canProduce('video')) throw new Error('browser cannot produce video with these codecs');
      return [a, b];
    });

    const sendT = await step(2, async () => {
      const d = must(await post('/transports', { roomId, peerId: A, direction: 'send' }), 200, 'send transport');
      const t = devA.createSendTransport(d);
      wireTransport(t, roomId, A);
      t.on('produce', async ({ kind, rtpParameters, appData }, ok, fail) => {
        const r = await post('/produce', { roomId, peerId: A, transportId: t.id, kind, rtpParameters, source: appData.source });
        r.status === 200 ? ok({ id: r.json.data.producerId }) : fail(new Error('produce ' + r.status));
      });
      return t;
    });
    S.sendT = sendT;

    const prod = await step(3, async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      S.stream = stream;
      $('va').srcObject = stream;
      const v = await sendT.produce({ track: stream.getVideoTracks()[0], appData: { source: 'camera' } });
      const a = await sendT.produce({ track: stream.getAudioTracks()[0], appData: { source: 'mic' } });
      return { v, a };
    });

    const recvT = await step(4, async () => {
      const d = must(await post('/transports', { roomId, peerId: B, direction: 'recv' }), 200, 'recv transport');
      const t = devB.createRecvTransport(d);
      wireTransport(t, roomId, B);
      return t;
    });
    S.recvT = recvT;

    const list = await step(5, async () => {
      const l = must(await get(`/producers/${roomId}?exceptPeerId=${B}`), 200, 'list producers');
      if (l.length !== 2) throw new Error('expected 2 producers, saw ' + l.length);
      return l;
    });

    await step(6, async () => {
      const out = [];
      for (const p of list) {
        const d = must(await post('/consume', {
          roomId, peerId: B, producerId: p.producerId, rtpCapabilities: devB.rtpCapabilities,
        }), 200, 'consume ' + p.kind);
        const c = await recvT.consume({ id: d.id, producerId: d.producerId, kind: d.kind, rtpParameters: d.rtpParameters });
        must(await post('/consumer/resume', { roomId, peerId: B, consumerId: c.id }), 200, 'resume');
        out.push(c.track);
      }
      $('vb').srcObject = new MediaStream(out);
      return out;
    });

    await step(7, async () => {
      const v = $('vb');
      for (let i = 0; i < 40; i++) {
        if (v.videoWidth > 0) return;
        await new Promise((r) => setTimeout(r, 250));
      }
      throw new Error('no video frames after 10 s (check ANNOUNCED_IP and UDP ports 40000\u201340100)');
    });

    await step(8, async () => {
      const r = await post('/consume', { roomId, peerId: A, producerId: prod.v.id, rtpCapabilities: devA.rtpCapabilities });
      if (r.status !== 400) throw new Error('expected 400, got ' + r.status);
    });

    await step(9, async () => {
      const r = await post('/consume', { roomId, peerId: B, producerId: list[0].producerId, rtpCapabilities: devB.rtpCapabilities });
      if (r.status !== 409) throw new Error('expected 409, got ' + r.status);
    });

    $('verdict').className = 'verdict ok';
    $('verdict').textContent = 'Part 1 passed (10/10). Now click \u201c2. Test leave + cleanup\u201d.';
  } catch (e) {
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = 'Stopped at the first failure. Details are in the list and log.';
  } finally {
    $('go').disabled = false;
    $('stop').disabled = !S.roomId;
  }
};

/* =========================================================
 * PART 2 \u2013 leave and cleanup (Step 9)
 * ========================================================= */

/**
 * testLeave()
 *
 * STEP 1: Send /peers/leave with missing fields.
 *         Expect 400 (validation works).
 *
 * STEP 2: Peer A calls /peers/leave.
 *         Expect 200, closedProducerIds.length === 2 (camera + mic),
 *         and roomClosed === false because Peer B is still in the room.
 *
 * STEP 3: Peer A calls /peers/leave again.
 *         Expect 200 and an empty list (idempotent).
 *
 * STEP 4: GET /producers/:roomId.
 *         Expect an empty list, because A's producers are closed.
 *
 * STEP 5: Peer B calls /peers/leave.
 *         It is the last peer, so expect roomClosed === true.
 *
 * STEP 6: Ask for router capabilities of the same room again.
 *         Expect 200 (a fresh Router is created, proves the old one
 *         was removed cleanly). Then leave with a ghost peer, which
 *         closes this new Router so nothing is left behind.
 */
async function testLeave() {
  const { roomId, A, B } = S;
  if (!roomId) throw new Error('Run Part 1 first');

  // STEP 1
  await step(10, async () => {
    const r = await post('/peers/leave', { roomId });
    check(r.status === 400, 'expected 400, got ' + r.status);
  });

  // STEP 2
  await step(11, async () => {
    const r = await post('/peers/leave', { roomId, peerId: A });
    check(r.status === 200, 'expected 200, got ' + r.status);
    const d = r.json?.data;
    check(d?.closedProducerIds?.length === 2, 'expected 2 closed producers, got ' + d?.closedProducerIds?.length);
    check(d.roomClosed === false, 'room must stay open while Peer B is inside');
    log('  closed producers: ' + d.closedProducerIds.join(', '));
  });

  // STEP 3
  await step(12, async () => {
    const r = await post('/peers/leave', { roomId, peerId: A });
    check(r.status === 200, 'expected 200, got ' + r.status);
    check(r.json?.data?.closedProducerIds?.length === 0, 'second leave must return an empty list');
  });

  // STEP 4
  await step(13, async () => {
    const l = await get(`/producers/${roomId}`);
    check(l.status === 200, 'expected 200, got ' + l.status);
    check(l.json?.data?.length === 0, 'expected 0 producers, saw ' + l.json?.data?.length);
  });

  // STEP 5
  await step(14, async () => {
    const r = await post('/peers/leave', { roomId, peerId: B });
    check(r.status === 200, 'expected 200, got ' + r.status);
    check(r.json?.data?.roomClosed === true, 'roomClosed should be true after the last peer leaves');
  });

  // STEP 6
  await step(15, async () => {
    const r = await get(`/router-capabilities/${roomId}`);
    check(r.status === 200, 'expected 200, got ' + r.status);
    const g = await post('/peers/leave', { roomId, peerId: 'ghost-peer' });
    check(g.status === 200 && g.json?.data?.roomClosed === true, 'ghost leave should close the new empty room');
  });
}

$('stop').onclick = async () => {
  $('stop').disabled = true; $('go').disabled = true;
  PART2_RESET();
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  try {
    // stop local camera/mic first so the browser light turns off
    S.stream?.getTracks().forEach((t) => t.stop());
    await testLeave();
    $('verdict').className = 'verdict ok';
    $('verdict').textContent = 'Part 2 passed (6/6). Now check Docker logs for \u201cPeer removed\u201d and \u201cRouter closed\u201d.';
    log('Next: docker compose logs sfu-service | look for "Peer removed" and "Router closed".');
  } catch (e) {
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = 'Leave test failed. Details are in the list and log.';
  } finally {
    $('go').disabled = false;
  }
};

/**
 * testAuth()
 *
 * STEP 1: GET /health without any secret. Expect 200
 *         (the Docker healthcheck must keep working).
 *
 * STEP 2: Call the API with NO x-internal-secret header. Expect 401.
 *
 * STEP 3: Call the API with a WRONG secret. Expect 401.
 *
 * STEP 4: Call the API with the CORRECT secret (from the input box).
 *         Expect 200. Uses /peers/leave with a ghost peer, which
 *         changes nothing on the server.
 *
 * STEP 5: Send invalid input with the correct secret
 *         (transport direction "sideways"). Expect 400.
 */
async function testAuth() {
  const apiBase = base();
  const root = apiBase.replace(/\/api\/v1\/sfu$/, '');
  const secret = $('secret').value.trim();
  const body = JSON.stringify({ roomId: 'auth-check', peerId: 'ghost' });
  const raw = (path, headers) => fetch(apiBase + path, { method: 'POST', headers, body });

  // STEP 1
  await step(PART3_START, async () => {
    const r = await fetch(root + '/health');
    check(r.status === 200, 'expected 200, got ' + r.status);
  });

  // STEP 2
  await step(PART3_START + 1, async () => {
    const r = await raw('/peers/leave', { 'Content-Type': 'application/json' });
    check(r.status === 401, 'expected 401, got ' + r.status);
  });

  // STEP 3
  await step(PART3_START + 2, async () => {
    const r = await raw('/peers/leave', { 'Content-Type': 'application/json', 'x-internal-secret': 'wrong-' + Date.now() });
    check(r.status === 401, 'expected 401, got ' + r.status);
  });

  // STEP 4
  await step(PART3_START + 3, async () => {
    check(secret, 'type the secret in the input box first');
    const r = await raw('/peers/leave', { 'Content-Type': 'application/json', 'x-internal-secret': secret });
    check(r.status === 200, 'expected 200, got ' + r.status + ' (is the secret the same as INTERNAL_SECRET?)');
  });

  // STEP 5
  await step(PART3_START + 4, async () => {
    const r = await post('/transports', { roomId: 'auth-check', peerId: 'ghost', direction: 'sideways' });
    check(r.status === 400, 'expected 400, got ' + r.status);
    log('  validation message: ' + (r.json?.message ?? '(none)'));
  });
}

$('auth').onclick = async () => {
  $('auth').disabled = true;
  for (let i = PART3_START; i < STEPS.length; i++) mark(i, '', '');
  $('verdict').className = 'verdict'; $('verdict').textContent = '';
  try {
    await testAuth();
    $('verdict').className = 'verdict ok';
    $('verdict').textContent = 'Part 3 passed (5/5). Auth and validation work.';
  } catch (e) {
    $('verdict').className = 'verdict bad';
    $('verdict').textContent = 'Auth test failed. Details are in the list and log.';
  } finally {
    $('auth').disabled = false;
  }
};

function PART2_RESET() {
  for (let i = PART2_START; i < STEPS.length; i++) mark(i, '', '');
}
</script>
</body>
</html>
