<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC Test Client — Google Meet Dev</title>
    <style>
      /* ------------------------------------------------------------------ */
      /* RESET & BASE                                                         */
      /* ------------------------------------------------------------------ */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:          #0d0d0f;
        --surface:     #16161a;
        --surface2:    #1e1e24;
        --border:      #2a2a35;
        --accent:      #4f8ef7;
        --accent-glow: rgba(79,142,247,0.25);
        --success:     #3fcf8e;
        --warning:     #f0a742;
        --error:       #f76060;
        --text:        #e8e8f0;
        --text-muted:  #7a7a95;
        --radius:      12px;
        --font:        'Inter', system-ui, sans-serif;
      }

      html, body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
      }

      /* ------------------------------------------------------------------ */
      /* LAYOUT                                                               */
      /* ------------------------------------------------------------------ */
      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100vh;
        padding: 24px;
        gap: 20px;
        max-width: 1100px;
        margin: 0 auto;
      }

      /* HEADER */
      header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, var(--accent), #9b59f7);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }
      header h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: .01em;
      }
      header p {
        margin-left: auto;
        font-size: 11px;
        color: var(--text-muted);
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 3px 10px;
        border-radius: 20px;
      }

      /* CONTROL PANEL */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .panel h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: .08em;
        color: var(--text-muted);
        margin-bottom: 2px;
      }

      .input-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
        flex: 1;
        min-width: 200px;
      }
      .field label {
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
        letter-spacing: .04em;
        text-transform: uppercase;
      }
      .field input {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 9px 13px;
        font-size: 13px;
        font-family: 'Courier New', monospace;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
        width: 100%;
      }
      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .field input::placeholder { color: var(--text-muted); opacity: .6; }

      .btn-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* Buttons */
      button {
        border: none;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        border-radius: 8px;
        transition: all .15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #joinBtn {
        background: linear-gradient(135deg, var(--accent), #6a7ef7);
        color: #fff;
        padding: 10px 22px;
        font-size: 13px;
        box-shadow: 0 2px 12px var(--accent-glow);
      }
      #joinBtn:hover { filter: brightness(1.1); box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-1px); }
      #joinBtn:active { transform: translateY(0); filter: brightness(.95); }
      #joinBtn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; }

      #leaveBtn {
        background: transparent;
        border: 1px solid var(--error);
        color: var(--error);
        padding: 10px 22px;
        font-size: 13px;
        display: none;
      }
      #leaveBtn:hover { background: rgba(247,96,96,.12); }

      /* Status badge */
      #statusBadge {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 20px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--text-muted);
        transition: all .3s;
      }
      #statusBadge.connected    { border-color: var(--success); color: var(--success); background: rgba(63,207,142,.1); }
      #statusBadge.calling      { border-color: var(--warning); color: var(--warning); background: rgba(240,167,66,.1); }
      #statusBadge.live         { border-color: var(--success); color: var(--success); background: rgba(63,207,142,.15);
                                   animation: pulse-badge 2s infinite; }
      #statusBadge.error        { border-color: var(--error);   color: var(--error);   background: rgba(247,96,96,.1); }

      @keyframes pulse-badge {
        0%, 100% { box-shadow: 0 0 0 0 rgba(63,207,142,.4); }
        50%       { box-shadow: 0 0 0 5px rgba(63,207,142,0); }
      }

      /* VIDEO GRID */
      .video-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .video-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
        aspect-ratio: 16/9;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .video-card video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        border-radius: var(--radius);
      }

      .video-label {
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(0,0,0,.6);
        backdrop-filter: blur(6px);
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        color: #fff;
        pointer-events: none;
      }

      .video-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 12px;
        height: 100%;
      }
      .video-placeholder .icon { font-size: 38px; opacity: .35; }

      /* ICE state indicator */
      .ice-indicator {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--text-muted);
        transition: background .3s;
      }
      .ice-indicator.checking  { background: var(--warning); animation: blink 1s infinite; }
      .ice-indicator.connected { background: var(--success); }
      .ice-indicator.failed    { background: var(--error); }

      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

      /* LOG PANEL */
      .log-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .log-panel-header {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .06em;
      }
      .log-panel-header span { margin-left: auto; cursor: pointer; }
      .log-panel-header span:hover { color: var(--text); }

      #logOutput {
        font-family: 'Courier New', monospace;
        font-size: 11.5px;
        line-height: 1.7;
        padding: 12px 16px;
        max-height: 220px;
        overflow-y: auto;
        color: var(--text-muted);
      }
      #logOutput .entry { display: flex; gap: 8px; }
      #logOutput .ts    { color: #444; flex-shrink: 0; }
      #logOutput .tag-info    { color: var(--accent); }
      #logOutput .tag-success { color: var(--success); }
      #logOutput .tag-warn    { color: var(--warning); }
      #logOutput .tag-error   { color: var(--error); }
      #logOutput .msg { word-break: break-all; }

      /* Scrollbar */
      #logOutput::-webkit-scrollbar { width: 4px; }
      #logOutput::-webkit-scrollbar-track { background: transparent; }
      #logOutput::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

      /* Responsive */
      @media (max-width: 600px) {
        .video-grid { grid-template-columns: 1fr; }
        .input-row  { flex-direction: column; }
      }
    </style>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">

      <!-- HEADER -->
      <header>
        <div class="logo">📹</div>
        <h1>WebRTC Test Client</h1>
        <p>Phase 6 · Diagnostic Tool · Not a Deployable</p>
      </header>

      <!-- CONTROL PANEL -->
      <div class="panel">
        <h2>Connection</h2>
        <div class="input-row">
          <div class="field">
            <label for="token">Access Token (JWT)</label>
            <input
              id="token"
              type="text"
              placeholder="eyJhbGciOi..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field" style="max-width:220px">
            <label for="roomCode">Room Code</label>
            <input
              id="roomCode"
              type="text"
              placeholder="XYZABC"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </div>

        <div class="btn-row">
          <button id="joinBtn">▶ Join Call</button>
          <button id="leaveBtn">✕ Leave</button>
          <span id="statusBadge">Idle</span>
        </div>
      </div>

      <!-- VIDEO GRID -->
      <div class="video-grid">
        <!-- Local -->
        <div class="video-card" id="localCard">
          <div class="video-placeholder" id="localPlaceholder">
            <div class="icon">🎥</div>
            <span>Local camera will appear here</span>
          </div>
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-label">You (Local)</div>
          <div class="ice-indicator" id="localIceIndicator"></div>
        </div>

        <!-- Remote -->
        <div class="video-card" id="remoteCard">
          <div class="video-placeholder" id="remotePlaceholder">
            <div class="icon">👤</div>
            <span>Remote peer will appear here</span>
          </div>
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label">Remote Peer</div>
          <div class="ice-indicator" id="remoteIceIndicator"></div>
        </div>
      </div>

      <!-- LOG PANEL -->
      <div class="log-panel">
        <div class="log-panel-header">
          🔬 Handshake Log
          <span id="clearLog" title="Clear log">✕ Clear</span>
        </div>
        <div id="logOutput"></div>
      </div>

    </div>

    <!-- Socket.io client from CDN (no build step needed) -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- App logic -->
    <script src="app.js"></script>
  </body>
</html>
