apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus          # fixed uid so the dashboard JSON can refer to it
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false

