name: Security Scans

on:
  pull_request:
  push:
    branches: [main, phase-14-cicd]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Secret Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder:
          - services/api-gateway
          - services/auth-service
          - services/user-service
          - services/room-service
          - services/signaling-service
          - services/chat-service
          - services/sfu-service
          - services/recording-service
          - services/notification-service
          - FRONTEND/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run npm audit
        working-directory: ${{ matrix.folder }}
        run: npm audit --omit=dev --audit-level=high || true

  trivy-fs:
    name: Filesystem & Config Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

